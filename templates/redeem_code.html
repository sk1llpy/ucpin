{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить Redeem Код | Административный сайт Django</title>

    <style>
        body {
            background-color: rgb(17, 24, 39);
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #1f2937;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        hr {
            border: none;
            border-top: 2px solid #374151;
            margin-bottom: 20px;
        }

        label {
            color: #d1d5db;
            font-weight: bold;
            display: block;
            text-align: left;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        textarea, select {
            background-color: #374151;
            color: #d1d5db;
            border: none;
            border-radius: 5px;
            padding: 15px;
            font-size: 0.9rem;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        textarea::placeholder {
            color: #9ca3af;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: blueviolet;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: rebeccapurple;
        }

        a {
            color: #8b5cf6;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 15px;
            display: inline-block;
            transition: color 0.3s;
        }

        a:hover {
            color: #a78bfa;
        }

        .error-message {
            background-color: #b91c1c;
            color: rgb(206, 206, 206);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Добавить код активации</h1>
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        <hr />
        <form method="post">
            {% csrf_token %}
            <label for="code">Redeem Код:</label>
            <textarea rows="8" placeholder="Redeem-code larni yozing..." required name="code" id="code"></textarea>
            <label for="package">Package:</label>
            <select name="package" id="package">
                {% for package in packages %}
                    <option value="{{ package.pk }}">{{ package.title }}</option>
                {% endfor %}
            </select>
            <button type="submit">Добавить</button>
        </form>
        <a href="/admin/shop/redeemcode/">Назад к списку</a>
    </div>
</body>
</html>
