server {
    listen 80;
    server_name ucpin.uz;

    location / {
        proxy_pass http://web:8000;  # Proxy to Django web app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

server {
    listen 443 ssl;
    server_name ucpin.uz;

    ssl_certificate /etc/letsencrypt/live/ucpin.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ucpin.uz/privkey.pem;

    location / {
        proxy_pass http://web:8000;  # Proxy to Django web app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
